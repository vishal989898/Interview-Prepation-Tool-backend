# Server Configuration
spring.application.name=interview-ai-backend
server.port=${PORT:8080}

# MySQL Database Configuration
# spring.datasource.url=jdbc:mysql://localhost:3306/interview_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.url=${DB_URL}

spring.datasource.username={DB_USERNAME}
spring.datasource.password={DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# jwt.secret=9d3e226401c1724370b0add8b28bac69f052beb81ed7d96f43700205dc9e965e
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Google AI API Configuration
google.genai.api.key=${GEMINI_API_KEY}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.interview=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
